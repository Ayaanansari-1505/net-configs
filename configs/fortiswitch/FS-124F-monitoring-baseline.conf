# =====================================================================
# FS-124F standalone — per-site monitoring baseline (FortiSwitchOS 7.x)
# Purpose: enable SNMP + REST API read access for the central dashboard
# collector. Replace ALL placeholder values before applying.
#   <COLLECTOR-IP>   central poller source IP (over the mgmt VPN)
#   <SITE-ID>        e.g. BR-014
# Verify syntax against your exact FortiSwitchOS train; names below are
# valid on recent 7.x builds.
# =====================================================================

# --- SNMP agent: system info -----------------------------------------
config system snmp sysinfo
    set status enable
    set description "FS-124F <SITE-ID> access switch"
    set contact-info "netops@example.com"
    set location "<SITE-ID>"
end

# --- Preferred: SNMPv3 (authPriv), locked to the collector -----------
config system snmp user
    edit "dashboard-v3"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd  "<STRONG-AUTH-PASSPHRASE>"
        set priv-proto aes256
        set priv-pwd  "<STRONG-PRIV-PASSPHRASE>"
        set notify-hosts <COLLECTOR-IP>
        set queries enable
        set events cpu-high mem-low intf-ip ent-conf-change
    end
end

# --- Fallback: SNMPv2c community (mgmt VLAN only, unique per site) ---
config system snmp community
    edit 1
        set name "<UNIQUE-RO-COMMUNITY-<SITE-ID>>"
        set status enable
        config hosts
            edit 1
                set ip <COLLECTOR-IP> 255.255.255.255
            end
        end
        set query-v2c-status enable
        set trap-v2c-status enable
        set events cpu-high mem-low intf-ip ent-conf-change
    end
end

# --- Read-only admin profile for API access ---------------------------
config system accprofile
    edit "ro-monitor"
        # read-only everywhere; adjust scope names to your build
        set admingrp read
        set loggrp   read
        set netgrp   read
        set routegrp read
        set sysgrp   read
        set utilgrp  read
    end
end

# --- Auth mode A (preferred, 7.x): REST API admin with token ----------
# GUI: System > Administrators > Create New > REST API Admin
#   name: dashboard-api  profile: ro-monitor  trusted host: <COLLECTOR-IP>/32
#   -> the API token is displayed ONCE; store it in your secret manager.
# If your build exposes it in CLI (varies by train):
# config system api-user
#     edit "dashboard-api"
#         set accprofile "ro-monitor"
#         config trusthost
#             edit 1
#                 set ipv4-trusthost <COLLECTOR-IP> 255.255.255.255
#             end
#         end
#     end
# end
# execute api-user generate-key dashboard-api

# --- Auth mode B (all builds): read-only local admin, session login ---
config system admin
    edit "api-ro"
        set accprofile "ro-monitor"
        set password "<STRONG-UNIQUE-PASSWORD>"
        # If supported on your build, restrict source:
        # set trusthost1 <COLLECTOR-IP> 255.255.255.255
    end
end

# --- Hygiene ----------------------------------------------------------
# * HTTPS admin access only on the mgmt interface/VLAN facing the VPN.
# * Unique credentials/communities per site; rotate via your automation.
# * NTP must be synced (dashboards correlate timestamps across sites):
config system ntp
    set ntpsync enable
    set server-mode disable
end
